# tmux-pi-waiting.conf — surface pi.dev windows waiting for input, tmux-wide.
# Add to .tmux.conf (after tmux-notify.conf): source-file ~/.dotfiles/tmux/tmux-pi-waiting.conf
#
# Paired with the pi-waiting-indicator.ts extension, which sets the
# @pi_waiting window option to "on" when pi goes idle waiting for input,
# and "off" once a new prompt is submitted or the session ends.

# Window list: prepend a bell to any window pi is waiting in (current session).
set -g window-status-format '#{?#{==:#{@pi_waiting},on},🔔 ,}#I:#W#F'
set -g window-status-current-format '#{?#{==:#{@pi_waiting},on},🔔 ,}#I:#W#F'

# Status bar: show 🔔<count> for waiting pi windows across ALL sessions.
set -ag status-right '#(~/.dotfiles/scripts/bin/tmux-pi-status)'

# Prefix+P: jump straight to a waiting pi window (fzf picker if more than one).
bind-key P display-popup -E "~/.dotfiles/scripts/bin/tmux-pi-jump"

# Clear the bell once you've actually looked at the window: selecting it
# (prefix+n/p/number, tmux-pi-jump) or focusing its pane (requires
# `set -g focus-events on`, already set in .tmux.conf) both dismiss it,
# without waiting for a new prompt to be submitted.
set-hook -g after-select-window 'set-window-option @pi_waiting off'
set-hook -g pane-focus-in 'set-window-option @pi_waiting off'
